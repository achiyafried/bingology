name: Deploy site

on:
  push:
    branches: [main]
    paths: ["site/**", "scripts/stamp.mjs", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # ref: main so a run called right after the nightly commit sees that commit
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
      # Version every module URL with the commit SHA so a cached old module never meets a new app.js
      # (HEAD, not github.sha: a nightly call checks out main after its own data commit)
      - run: node scripts/stamp.mjs site _site "$(git rev-parse --short HEAD)"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
