name: Update data

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    env:
      TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
      OMDB_KEY: ${{ secrets.OMDB_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Smoke test (3 series, writes nothing)
        run: node scripts/fetch-data.mjs --only 3
      - name: Fetch all series
        run: node scripts/fetch-data.mjs
      - id: commit
        name: Commit data.json if it changed
        run: |
          if [ -n "$(git status --porcelain site/data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add site/data.json
            git commit -m "chore: update series data"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  # A push made with GITHUB_TOKEN does not trigger deploy.yml, so deploy from here.
  deploy:
    needs: update
    if: needs.update.outputs.changed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy.yml
