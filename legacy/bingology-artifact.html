<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bingology</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Secular+One&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #EFECF8;
  --surface: #FFFFFF;
  --surface2: #E3DEF3;
  --ink: #1A1640;
  --muted: #5A5580;
  --line: #CFC8E6;
  --accent: #3B2FD0;
  --accent-ink: #FFFFFF;
  --ticket: #FFF6E3;
  --ticket-ink: #1A1640;
  --ticket-accent: #3B2FD0;
  --ticket-muted: #5E5878;
  --shadow: 0 10px 30px rgba(26, 22, 64, .16);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12102B;
    --surface: #1D1A40;
    --surface2: #2A2655;
    --ink: #F4F0FF;
    --muted: #ABA5D3;
    --line: #38336B;
    --accent: #FFC933;
    --accent-ink: #1A1640;
    --shadow: 0 10px 30px rgba(0, 0, 0, .45);
  }
}
:root[data-theme="dark"] {
  --bg: #12102B;
  --surface: #1D1A40;
  --surface2: #2A2655;
  --ink: #F4F0FF;
  --muted: #ABA5D3;
  --line: #38336B;
  --accent: #FFC933;
  --accent-ink: #1A1640;
  --shadow: 0 10px 30px rgba(0, 0, 0, .45);
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: "Assistant", system-ui, "Segoe UI", Arial, sans-serif;
  font-size: 17px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; border-radius: 8px; }
[tabindex="-1"]:focus { outline: none; }
.app { max-width: 560px; margin: 0 auto; padding: 16px 16px 56px; }
h1, h2, h3 { font-family: "Secular One", "Assistant", system-ui, sans-serif; font-weight: 400; margin: 0; line-height: 1.15; }

/* header */
.top { margin-bottom: 20px; }
.brand { display: flex; direction: ltr; justify-content: flex-end; align-items: center; gap: 12px; margin-bottom: 14px; color: var(--ink); }
.brand .ic { width: 44px; height: 44px; flex: none; }
.brand .wm { height: 36px; width: auto; }
.wm .acc { fill: var(--accent); }
.wm .accs { stroke: var(--accent); }
.tabs { display: flex; background: var(--surface); border-radius: 999px; padding: 4px; gap: 2px; }
.tab { flex: 1; text-align: center; border: 0; background: transparent; padding: 8px 6px; border-radius: 999px; font-size: 15px; font-weight: 600; color: var(--muted); }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

.av { position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; flex: none; width: 46px; height: 46px; border-radius: 50%; background: linear-gradient(150deg, hsl(var(--h) 50% 38%), hsl(calc(var(--h) + 50) 55% 20%)); color: #fff; font-family: "Secular One", "Assistant", sans-serif; font-size: 17px; direction: ltr; }
.av img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.phadd { padding: 8px 18px 6px; }
.phadd ol { margin: 6px 0 10px; padding-inline-start: 20px; font-size: 14.5px; color: var(--ticket-muted); }
.phadd a { color: var(--ticket-accent); font-weight: 700; }
.phadd small { display: block; color: var(--ticket-muted); font-size: 13px; margin-top: 6px; }
.pastezone { min-height: 56px; border: 2px dashed rgba(26, 22, 64, .3); border-radius: 12px; padding: 14px 12px; margin-bottom: 10px; color: var(--ticket-muted); text-align: center; cursor: text; caret-color: transparent; }
.pastezone:empty::before { content: attr(data-ph); }
.pastezone:focus { border-color: var(--ticket-accent); outline: none; }
#phMsg { font-size: 14.5px; margin-top: 8px; min-height: 1.2em; }
.phpanel { background: var(--surface); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
.phpanel p { margin: 6px 0 10px; color: var(--muted); font-size: 14.5px; }
.phpanel #phStatus { margin-top: 10px; font-size: 14.5px; }
.av.big { width: 68px; height: 68px; font-size: 26px; }
.arow { display: flex; align-items: center; gap: 12px; width: 100%; text-align: start; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 2px solid transparent; margin-bottom: 8px; }
.arow:hover { border-color: var(--line); }
.ainfo { flex: 1; min-width: 0; }
.ainfo b { display: block; font-size: 17px; font-weight: 700; }
.ainfo small { display: block; color: var(--muted); font-size: 14px; line-height: 1.3; }
.acount { flex: none; background: var(--surface2); border-radius: 999px; padding: 2px 11px; font-weight: 700; font-size: 14px; }
.search { width: 100%; padding: 13px 16px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; margin-bottom: 12px; }
.nm { background: none; border: 0; padding: 0; font: inherit; color: var(--accent); text-decoration: underline dotted; text-underline-offset: 3px; white-space: nowrap; }
.alinks { display: flex; flex-wrap: wrap; gap: 8px; }
.alinks a { padding: 7px 14px; font-size: 15px; }
.a-head { display: flex; align-items: center; gap: 14px; padding: 20px 18px 8px; }
.a-grid { padding: 8px 18px 4px; }
dialog .nm { color: var(--ticket-accent); }
/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 2px solid transparent; border-radius: 14px; padding: 13px 20px; font-weight: 700; font-size: 17px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.block { width: 100%; }
.linkbtn { background: none; border: 0; padding: 6px 2px; color: var(--muted); font-weight: 600; text-decoration: underline; text-underline-offset: 3px; }

/* intro */
.hero { text-align: center; padding-top: 6px; }
.fan { --w: min(116px, 26vw); position: relative; height: calc(var(--w) * 0.9 + 28px); margin: 6px auto 26px; }
.fan .fcard { position: absolute; top: 12px; left: 50%; width: var(--w); transform: translateX(calc(-50% + var(--k) * var(--w) * 0.62)) rotate(var(--r)); }
.fan .fcard .poster { border: 3px solid var(--ticket); box-shadow: var(--shadow); }
.hero h1 { font-size: clamp(40px, 11vw, 56px); margin-bottom: 12px; }
.hero p { color: var(--muted); max-width: 34ch; margin: 0 auto 26px; }
.hero .stack { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.hero .btn.primary { min-width: 230px; }

/* quiz */
.qhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; min-height: 36px; }
.bulbs { display: flex; gap: 8px; }
.bulb { width: 11px; height: 11px; border-radius: 50%; background: var(--line); }
.bulb.on { background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.count { color: var(--muted); font-size: 15px; min-width: 60px; text-align: end; }
.qbody h2 { font-size: clamp(27px, 7vw, 34px); margin-bottom: 8px; }
.qbody .sub { color: var(--muted); margin: 0 0 20px; }
.opt { display: flex; align-items: center; gap: 14px; width: 100%; text-align: start; padding: 15px 18px; border-radius: 16px; background: var(--surface); border: 2px solid transparent; margin-bottom: 10px; }
.opt:hover { border-color: var(--line); }
.opt[aria-pressed="true"] { border-color: var(--accent); }
.opt .em { font-size: 26px; width: 34px; text-align: center; flex: none; }
.opt b { display: block; font-size: 18px; line-height: 1.25; }
.opt small { display: block; color: var(--muted); font-size: 15px; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 24px; }
.chip { border: 2px solid var(--line); background: var(--surface); border-radius: 999px; padding: 9px 16px; font-weight: 600; font-size: 16px; }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
@media (prefers-reduced-motion: no-preference) {
  .qbody { animation: slidein .22s ease-out; }
  @keyframes slidein { from { opacity: 0; transform: translateX(-14px); } to { opacity: 1; transform: none; } }
}

/* poster grid */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.tile { position: relative; padding: 0; border: 0; background: none; border-radius: 12px; overflow: hidden; text-align: start; }
.tile img { display: block; width: 100%; aspect-ratio: 240 / 216; object-fit: cover; border-radius: 12px; }
.tile.seen img { opacity: .3; filter: grayscale(.9); }
.tile .badge { position: absolute; top: 6px; inset-inline-start: 6px; width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: none; align-items: center; justify-content: center; }
.tile.seen .badge { display: flex; }
.listbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
.listbar h2 { font-size: 26px; }
.note { color: var(--muted); font-size: 14px; margin-top: 22px; }
.sticky-cta { margin-top: 22px; display: flex; gap: 10px; flex-direction: column; }

/* ticket */
.ticket { position: relative; background: var(--ticket); color: var(--ticket-ink); border-radius: 20px; box-shadow: var(--shadow); }
.t-top { display: grid; grid-template-columns: 150px 1fr; gap: 16px; padding: 18px 18px 6px; align-items: start; }
.t-poster { width: 150px; aspect-ratio: 240 / 216; object-fit: cover; border-radius: 12px; display: block; }
.t-title { font-size: 28px; margin-bottom: 8px; word-break: break-word; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 0; font-size: 14px; color: var(--ticket-muted); margin-bottom: 10px; }
.meta span { padding-inline-end: 9px; margin-inline-end: 9px; border-inline-end: 1px solid rgba(26, 22, 64, .25); }
.meta span:last-child { border: 0; margin: 0; padding: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 13px; font-weight: 700; padding: 3px 10px; border-radius: 999px; background: rgba(59, 47, 208, .1); color: var(--ticket-accent); }
.t-line { padding: 6px 18px 0; margin: 0; font-size: 17px; }
.why { list-style: none; padding: 12px 18px 16px; margin: 0; display: grid; gap: 7px; }
.why li { display: flex; gap: 9px; align-items: flex-start; font-size: 15px; color: var(--ticket-muted); }
.why svg { flex: none; margin-top: 3px; color: var(--ticket-accent); }
.perf { position: relative; height: 22px; }
.perf::before, .perf::after { content: ""; position: absolute; top: 0; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); }
.perf::before { right: -11px; }
.perf::after { left: -11px; }
.perf i { position: absolute; top: 10px; left: 18px; right: 18px; border-top: 2px dashed rgba(26, 22, 64, .28); }
.stub { display: flex; gap: 16px; align-items: center; padding: 10px 18px 20px; }
.match { text-align: center; min-width: 86px; }
.match strong { display: block; font-family: "Secular One", "Assistant", sans-serif; font-weight: 400; font-size: 46px; line-height: 1; color: var(--ticket-accent); }
.match span { font-size: 14px; color: var(--ticket-muted); font-weight: 600; }
.acts { flex: 1; display: grid; gap: 8px; }
.ticket .btn.primary { background: var(--ticket-ink); color: var(--ticket); }
.ticket .btn.ghost { border-color: rgba(26, 22, 64, .25); color: var(--ticket-ink); }
.ticket .btn { padding: 11px 14px; font-size: 16px; }
.ticket .linkbtn { color: var(--ticket-muted); }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.chosen { background: rgba(30, 142, 90, .14); color: #14673F; border-radius: 12px; padding: 10px 12px; font-weight: 700; text-align: center; }
.alts h3 { font-size: 20px; margin: 26px 0 12px; }
.alts .grid { grid-template-columns: repeat(3, 1fr); }
.alts .tile .cap { display: block; font-size: 13px; font-weight: 600; padding-top: 5px; color: var(--muted); }
.foot { margin-top: 22px; display: flex; justify-content: center; gap: 18px; flex-wrap: wrap; }
.empty { background: var(--surface); border-radius: 18px; padding: 24px; text-align: center; }
.empty h2 { font-size: 26px; margin-bottom: 8px; }
.empty p { color: var(--muted); margin: 0 0 18px; }
.empty .btn { margin: 4px; }

.rtitle { font-size: clamp(28px, 7vw, 34px); text-align: center; margin: 2px 0 18px; }
.rates { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 18px 2px; }
.rate { font-size: 13px; background: rgba(26, 22, 64, .08); border-radius: 8px; padding: 2px 8px; color: var(--ticket-ink); }
.rate b { font-weight: 700; color: var(--ticket-muted); }
.why li.miss { color: #8F3730; }
.why li.miss svg { color: #B3261E; }
.ph { display: flex; align-items: flex-end; width: 100%; aspect-ratio: 240 / 216; padding: 10px; border-radius: 12px; overflow: hidden; background: linear-gradient(150deg, hsl(var(--h) 48% 34%), hsl(calc(var(--h) + 50) 55% 15%)); color: #fff; font-family: "Secular One", "Assistant", system-ui, sans-serif; font-size: clamp(14px, 4vw, 19px); line-height: 1.1; word-break: break-word; }
.t-poster.ph { width: 150px; font-size: 17px; }
.tile.seen .ph { opacity: .3; filter: grayscale(.9); }
.poster { display: block; width: 100%; height: auto; aspect-ratio: 240 / 216; border-radius: 12px; }
.t-poster.poster { width: 150px; }
.tile.seen .poster { opacity: .3; filter: grayscale(.9); }
.tile .cap { display: block; font-size: 13px; font-weight: 600; padding-top: 5px; color: var(--muted); }
.praise { margin: 12px 18px 0; padding: 4px 12px; border-inline-start: 3px solid var(--ticket-accent); color: var(--ticket-muted); font-size: 15px; }
.praise b { display: block; color: var(--ticket-ink); font-size: 14px; }
.trail { padding: 12px 18px 2px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; }
.trail .linkbtn { color: var(--ticket-muted); font-size: 15px; }
.toast { position: fixed; inset-inline: 12px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 2147483000; background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 14px; box-shadow: var(--shadow); font-size: 15px; }
.toast p { margin: 0 0 8px; }
.toast input { width: 100%; font: inherit; font-size: 13px; direction: ltr; padding: 8px 10px; border-radius: 8px; border: 0; background: rgba(128, 128, 160, .3); color: inherit; }
.trail a { display: inline-flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; color: var(--ticket-accent); text-decoration: none; border: 2px solid rgba(59, 47, 208, .28); border-radius: 999px; padding: 8px 16px; }
.trail a:hover { background: rgba(59, 47, 208, .08); }
.more { background: var(--surface); border-radius: 18px; padding: 18px; margin-top: 18px; }
.more h3 { font-size: 20px; margin: 0 0 10px; }
.more .sec { margin-bottom: 20px; }
.more .sec:last-of-type { margin-bottom: 8px; }
.more bdi { white-space: nowrap; }
.more dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; }
.more dt { color: var(--muted); font-weight: 700; }
.more dd { margin: 0; }
.more .aw { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.more .aw li { display: flex; gap: 10px; align-items: flex-start; }
.more .note { margin: 6px 0 0; }
.sim { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px 12px; }
.sim .tile { text-align: start; }
.why2 { display: block; font-size: 13px; line-height: 1.3; color: var(--muted); padding-top: 2px; }
/* dialog */
dialog .more { background: transparent; color: var(--ticket-ink); margin: 0; padding: 4px 18px 20px; }
dialog .more dt, dialog .why2, dialog .more .note, dialog .tile .cap { color: var(--ticket-muted); }
dialog { border: 0; padding: 0; border-radius: 22px; width: calc(100% - 32px); max-width: 460px; background: var(--ticket); color: var(--ticket-ink); box-shadow: var(--shadow); }
dialog::backdrop { background: rgba(10, 8, 30, .62); }
dialog .t-top { padding-top: 20px; }
dialog .btn.primary { background: var(--ticket-ink); color: var(--ticket); }
dialog .btn.ghost { border-color: rgba(26, 22, 64, .25); color: var(--ticket-ink); }
.d-acts { display: grid; gap: 8px; padding: 6px 18px 20px; }
.d-line { padding: 4px 18px 14px; margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (max-width: 380px) {
  .t-top { grid-template-columns: 1fr; }
  .t-poster, .t-poster.ph, .t-poster.poster { width: 100%; max-width: 220px; }
}
</style>
</head>

<div class="app" id="app"></div>

<script>
const P = [];

/* [שם, שנה, עונות, פרקים, דקות לפרק, ז׳אנרים, מצבי רוח, כובד 1-3, עדיף לבד, תיאור] */

function mix(c1, c2, t) {

}
function wrapTitle(n) {
  const lines = []; let cur = "";
  for (const w of n.split(" ")) {
    if (cur && (cur + " " + w).length > 13) { lines.push(cur); cur = w; } else cur = cur ? cur + " " + w : w;
  }
  if (cur) lines.push(cur);
  return lines;
}
let _gid = 0;
function art(i, cls) {

  const id = "pg" + (++_gid), esc = x => x.replace(/&/g, "&amp;");
  const lines = wrapTitle(s.n), long = Math.max(...lines.map(l => l.length));
  const fs = lines.length > 3 || long > 13 ? 20 : long > 10 ? 25 : 30, lh = Math.round(fs * 1.1), y0 = 204 - (lines.length - 1) * lh;
  const txt = lines.map((l, k) => `<tspan x="14" y="${y0 + k * lh}">${esc(l)}</tspan>`).join("");
  return `<svg class="poster ${cls}" viewBox="0 0 240 216" role="img" aria-label="${esc(s.n)}" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="${id}a" x1="0" y1="0" x2=".5" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient><linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset=".5" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".75"/></linearGradient></defs><rect width="240" height="216" fill="url(#${id}a)"/><g transform="translate(12 -8) scale(.9)">${MOTIF[m](a, b, mix(c1, c2, .42))}</g><rect width="240" height="216" fill="url(#${id}b)"/><text fill="#fff" font-family="'Secular One','Assistant',system-ui,sans-serif" font-size="${fs}" direction="ltr" style="unicode-bidi:isolate">${txt}</text></svg>`;

function poolIds(src, plats) {
  let ids = S.map((_, i) => i);
  if (src === "mine") ids = ids.filter(i => i < MINE_N);
  if (src === "nyt") ids = ids.filter(i => S[i].nyt).sort((x, y) => S[x].nyt - S[y].nyt);
  if (plats && plats.length) ids = ids.filter(i => plats.includes(S[i].plat));

/* ranking */
const CROSS = '<svg viewBox="0 0 20 20" width="17" height="17" aria-hidden="true"><path d="M5.5 5.5l9 9M14.5 5.5l-9 9" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>';
const bL = m => m <= 32 ? 0 : m <= 52 ? 1 : 2;
const bS = n => n === 1 ? 0 : n <= 3 ? 1 : n <= 6 ? 2 : 3;
const LEN_IDX = { s: 0, m: 1, l: 2 };
const SEAS_IDX = { one: 0, few: 1, mid: 2, many: 3 };
const LEN_TXT = { s: "עד חצי שעה", m: "כ-45 דקות", l: "שעה ומעלה" };
const SEAS_TXT = { one: "עונה אחת", few: "2–3 עונות", mid: "4–6 עונות", many: "7 עונות ומעלה" };

function rank(surprise) {
  const rnd = mulberry(Math.floor(Math.random() * 1e9));
  const a = st.ans;
  const answered = a.genres.length || a.mood || a.weight || a.imdb || a.rt || a.len || a.seasons || a.lang;
  const out = [];
  const pool = new Set(poolIds(a.src, a.platforms));
  S.forEach((s, i) => {
    if (st.seen.has(i) || !pool.has(i)) return;
    if (surprise || !answered) { out.push({ i, sc: rnd(), pct: null, why: [{ ok: true, t: "נבחרה באקראי מתוך הרשימה" }] }); return; }
    let sc = 0, max = 0; const items = [];
    const add = (w, got, okT, noT) => { max += w; sc += got; const ok = got >= w * 0.5; items.push({ ok, w, t: ok ? okT : noT }); };
    if (a.genres.length) {
      const hit = s.g.filter(x => a.genres.includes(x));
      const got = hit.length ? 3 * Math.min(1, Math.max(0.6, hit.length / Math.min(a.genres.length, 2))) : 0;
      add(3, got, "בז׳אנר שבחרתם: " + hit.map(x => GENRES[x]).join(", "), "לא בדיוק בז׳אנרים שבחרתם");
    }
    if (a.lang) {
      const match = a.lang === "other" ? !["en", "he"].includes(s.lang) : s.lang === a.lang;
      add(3, match ? 3 : 0, "שפת מקור: " + LNAME[s.lang], "שפת המקור היא " + LNAME[s.lang]);
    }
    if (a.imdb) {
      const got = s.imdb >= a.imdb ? 2.5 : s.imdb >= a.imdb - 0.3 ? 1 : 0;
      add(2.5, got, `ציון IMDb ${s.imdb.toFixed(1)}`, `ציון IMDb ${s.imdb.toFixed(1)} (ביקשתם ${a.imdb.toFixed(1)}+)`);
    }
    if (a.rt && s.rt != null) {
      const got = s.rt >= a.rt ? 2 : s.rt >= a.rt - 5 ? 0.8 : 0;
      add(2, got, `${s.rt}% ממבקרי רוטן טומייטו`, `${s.rt}% ברוטן טומייטו (ביקשתם ${a.rt}%+)`);
    }
    if (a.mood) {
      const got = s.mo.includes(a.mood) ? (s.mo[0] === a.mood ? 2 : 1.6) : 0;
      add(2, got, "מתאימה למצב הרוח: " + MOODS[a.mood], "פחות מתאימה למצב הרוח שבחרתם");
    }
    if (a.seasons) {
      const d = Math.abs(bS(s.s) - SEAS_IDX[a.seasons]);
      add(2, [2, 0.7, 0, 0][d], `${s.s === 1 ? "עונה אחת" : s.s + " עונות"}, ${s.e} פרקים`, `${s.s === 1 ? "עונה אחת" : s.s + " עונות"} (ביקשתם ${SEAS_TXT[a.seasons]})`);
    }
    if (a.len) {
      const d = Math.abs(bL(s.m) - LEN_IDX[a.len]);
      add(1.5, [1.5, 0.5, 0][d], `פרקים של כ-${s.m} דקות`, `פרקים של כ-${s.m} דקות (ביקשתם ${LEN_TXT[a.len]})`);
    }
    if (a.weight) {
      const d = Math.abs(s.h - a.weight);
      add(1.5, [1.5, 0.6, 0][d], WEIGHT_WHY[s.h], s.h > a.weight ? "כבדה יותר ממה שביקשתם" : "קלילה יותר ממה שביקשתם");
    }
    const norm = max ? sc / max : 1;
    const pct = Math.min(100, Math.round(100 * norm));
    const hits = items.filter(x => x.ok).sort((x, y) => y.w - x.w).slice(0, 5);
    const misses = items.filter(x => !x.ok).sort((x, y) => y.w - x.w).slice(0, 2);
    out.push({ i, sc: norm + s.imdb / 10 * 0.04 + rnd() * 0.02, pct, why: hits.concat(misses) });
  });
  out.sort((x, y) => y.sc - x.sc);
  st.ranked = out; st.idx = 0; st.chosen = false; st.surprise = surprise || !answered;
}

const crew = i => ((MORE[i] || [])[0] || "").split(", ").map(x => x.replace(/\s*\(.*\)/, "").replace(/^בהפקת /, "").trim()).filter(Boolean);
function similar(i, n) {
  const s = S[i], mine = crew(i);
  return S.map((o, j) => {
    if (j === i) return null;
    const g = o.g.filter(x => s.g.includes(x)), m = o.mo.filter(x => s.mo.includes(x));
    const shared = crew(j).filter(x => mine.includes(x));
    const sc = (shared.length ? 4 : 0) + 2 * g.length + 1.2 * m.length + (o.h === s.h ? 1 : Math.abs(o.h - s.h) === 1 ? 0.3 : -0.5) + (o.lang === s.lang ? 0.3 : 0) + (o.plat === s.plat ? 0.2 : 0) + (Math.abs(o.y - s.y) <= 5 ? 0.3 : 0) + o.imdb / 20;
    const why = shared.length ? `מאותם יוצרים (${shared[0]})` : g.length ? "גם " + g.slice(0, 2).map(x => GENRES[x]).join(" ו") + (m.length ? ", באותו מצב רוח" : "") : "באותו מצב רוח";
    return { j, sc, why };
  }).filter(Boolean).sort((a, b) => b.sc - a.sc).slice(0, n || 4);
}
function moreHTML(i) {
  const m = MORE[i] || [], s = S[i];
  const names = x => x.split(", ").map(n => `<bdi>${n}</bdi>`).join(", ");
  const rows = [];
  if (m[0]) rows.push(`<dt>יוצרים</dt><dd>${names(m[0])}</dd>`);
  if (m[1]) rows.push(`<dt>${m[3] || "בכיכוב"}</dt><dd>${actorLinks(m[1])}</dd>`);
  const aw = (s.nyt ? [["📰", `מקום ${s.nyt} ברשימת 100 הסדרות הטובות של המאה ה-21 של הניו יורק טיימס (2026)`]] : []).concat((m[2] || []).map(a => ["🏆", a]));
  return `<section class="more" aria-label="עוד על הסדרה">
    ${rows.length ? `<div class="sec"><h3>מי עומד מאחורי הסדרה</h3><dl>${rows.join("")}</dl></div>` : ""}
    ${aw.length ? `<div class="sec"><h3>פרסים והכרה</h3><ul class="aw">${aw.map(a => `<li><span aria-hidden="true">${a[0]}</span><span>${a[1]}</span></li>`).join("")}</ul></div>` : ""}
    <div class="sec"><h3>אם אהבתם, אולי גם</h3><div class="sim">${similar(i).map(x => `<button class="tile${st.seen.has(x.j) ? " seen" : ""}" data-a="detail" data-i="${x.j}" aria-label="${S[x.j].n}">${poster(x.j, "")}<span class="badge">${CHECK}</span><span class="cap"><bdi>${S[x.j].n}</bdi></span><span class="why2">${x.why}</span></button>`).join("")}</div></div>
    <p class="note">מוצגים הפרסים הבולטים בלבד, לא רשימה מלאה.</p>
  </section>`;
}

function praiseHTML(s) {
  const p = PRAISE[s.id];
  return p ? `<p class="praise"><b>המבקרים בקצרה</b>${p}</p>` : "";
}

/* helpers */
function trailerHTML(s) {
  const q = (/[\u0590-\u05FF]/.test(s.n) ? s.n + " טריילר רשמי" : s.n + " TV series official trailer");
  const url = "https://www.youtube.com/results?search_query=" + encodeURIComponent(q);
  return `<div class="trail"><a href="${url}" target="_blank" rel="noopener noreferrer"><svg viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M6 4l10 6-10 6z" fill="currentColor"/></svg>צפייה בטריילר<span class="sr"> (נפתח בלשונית חדשה ביוטיוב)</span></a><button class="linkbtn" data-a="copylink" data-u="${url}">העתקת קישור</button></div>`;
}
function metaHTML(s) {
  return `<div class="meta"><span>${s.y}</span><span>${s.s === 1 ? "עונה אחת" : s.s + " עונות"}</span><span>${s.e} פרקים</span><span>כ-${s.m} דק׳ לפרק</span></div>`;
}
function ratesHTML(s) {
  return `<div class="rates"><span class="rate"><b>IMDb</b> ${s.imdb.toFixed(1)}</span>${s.rt != null ? `<span class="rate"><b>רוטן טומייטו</b> ${s.rt}%</span>` : ""}${s.nyt ? `<span class="rate"><b>ניו יורק טיימס</b> מקום ${s.nyt}</span>` : ""}<span class="rate"><b>פלטפורמה</b> ${PLAT_LABEL[s.plat]}</span><span class="rate"><b>שפה</b> ${LNAME[s.lang]}</span></div>`;
}
function tagsHTML(s) { return `<div class="tags">${s.g.map(g => `<span class="tag">${GENRES[g]}</span>`).join("")}</div>`; }
function bulbs(n) { let h = ""; for (let i = 0; i < TOTAL_STEPS; i++) h += `<i class="bulb${i <= n ? " on" : ""}"></i>`; return `<div class="bulbs" role="img" aria-label="שלב ${n + 1} מתוך ${TOTAL_STEPS}">${h}</div>`; }
function tile(i, mode, cap) {
  const s = S[i], seen = st.seen.has(i);
  const pre = st.tab === "list" && st.listSrc === "nyt" && s.nyt ? s.nyt + ". " : "";
  return `<button class="tile${seen ? " seen" : ""}" data-a="${mode}" data-i="${i}" ${mode === "toggle" ? `aria-pressed="${seen}"` : ""} aria-label="${s.n}${seen ? ", סומנה כנצפתה" : ""}">${poster(i, "")}<span class="badge">${CHECK}</span>${cap ? `<span class="cap">${pre}<bdi>${s.n}</bdi></span>` : ""}</button>`;
}

/* actors */
let ACT = null, ACTMAP = null;
function actorIndex() {
  if (ACT) return ACT;
  const m = new Map();
  S.forEach((s, i) => {
    const c = (MORE[i] || [])[1]; if (!c) return;
    c.split(", ").forEach(raw => { const n = raw.trim(); if (!n) return; if (!m.has(n)) m.set(n, []); if (!m.get(n).includes(i)) m.get(n).push(i); });
  });
  ACT = [...m.entries()].map(([n, ids]) => ({ n, ids }));
  ACTMAP = new Map(ACT.map((a, k) => [a.n, k]));
  ACT.forEach(a => { a.kw = /[\u0590-\u05FF]/.test(a.n) ? hebKey(a.n) : latKey(a.n); a.kf = a.kw.join(""); });
  return ACT;
}
function actorLinks(x) {
  actorIndex();
  return x.split(", ").map(n => { const k = ACTMAP.get(n.trim()); return k === undefined ? `<bdi>${n}</bdi>` : `<button class="nm" data-a="actor" data-k="${k}"><bdi>${n}</bdi></button>`; }).join(", ");
}
function avatar(n, big) {
  const parts = n.split(" ").filter(Boolean), ini = (parts[0][0] + (parts.length > 1 ? parts[parts.length - 1][0] : "")).toUpperCase();
  const h = [...n].reduce((a, c) => (a * 31 + c.charCodeAt(0)) % 360, 7);
  const img = PH[n] ? `<img src="/_blob/${PH[n]}" alt="">` : "";
  return `<span class="av${big ? " big" : ""}" style="--h:${h}" aria-hidden="true">${ini}${img}</span>`;
}
/* Hebrew name search by pronunciation: both the Latin name and the Hebrew query are reduced to a consonant skeleton */
const HMAP = { "ב": "B", "ג": "G", "ד": "D", "ז": "S", "ט": "T", "כ": "K", "ך": "K", "ק": "K", "ל": "L", "מ": "M", "ם": "M", "נ": "N", "ן": "N", "ס": "S", "פ": "P", "ף": "P", "ר": "R", "ש": "S", "ת": "T" };
const collapseKey = s => s.replace(/(.)\1+/g, "$1");
function hebKey(s) {
  return s.replace(/[\u0591-\u05C7]/g, "").split(/[\s\-]+/).filter(Boolean).map(w => {
    let out = "";
    for (let i = 0; i < w.length; i++) {
      const c = w[i], n = w[i + 1];
      if ("'׳’\"״".includes(c)) continue;
      if (c === "ו") { if (n === "ו") { out += "B"; i++; } else if (i === 0) out += "B"; continue; }
      if (c === "צ" || c === "ץ") { out += (n === "'" || n === "׳") ? "K" : "S"; continue; }
      out += HMAP[c] || "";
    }
    return collapseKey(out);
  }).filter(Boolean);
}
function latKey(s) {
  return s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z ]/g, "").split(/\s+/).filter(Boolean).map(w => {
    w = w.replace(/sch/g, "S").replace(/tch/g, "K").replace(/ch/g, "K").replace(/sh/g, "S").replace(/th/g, "T").replace(/ph/g, "P").replace(/ck/g, "K").replace(/qu/g, "KB").replace(/gh/g, "").replace(/x/g, "KS");
    let out = "";
    for (let i = 0; i < w.length; i++) {
      const c = w[i], n = w[i + 1] || "";
      if (c >= "A" && c <= "Z") { out += c; continue; }
      if ("bvw".includes(c)) out += "B";
      else if (c === "c") out += "eiy".includes(n) ? "S" : "K";
      else if ("kq".includes(c)) out += "K";
      else if ("gj".includes(c)) out += "G";
      else if ("sz".includes(c)) out += "S";
      else if ("fp".includes(c)) out += "P";
      else if ("dlmnrt".includes(c)) out += c.toUpperCase();
    }
    return collapseKey(out);
  }).filter(Boolean);
}
function keyMatch(a, q) {
  const qf = q.join("");
  if (qf.length < 2) return false;
  return qf.length >= 3 ? a.kf.includes(qf) : a.kw.some(w => w.startsWith(qf));
}
function actorRows() {
  const q = st.actQuery.trim().toLowerCase();
  let a = actorIndex();
  if (q) {
    const heb = /[\u0590-\u05FF]/.test(q), qk = heb ? hebKey(q) : [], qf = qk.join("");
    return a.map(x => {
      let s = 9;
      if (x.n.toLowerCase().includes(q)) s = 0;
      else if (heb && keyMatch(x, qk)) s = x.kf === qf ? 1 : x.kf.startsWith(qf) ? 2 : x.kw.some(w => w === qf || w.startsWith(qf)) ? 3 : 4;
      return { x, s };
    }).filter(o => o.s < 9).sort((p, r) => p.s - r.s || r.x.ids.length - p.x.ids.length || p.x.n.localeCompare(r.x.n)).map(o => o.x);
  }
  if (st.actMulti) a = a.filter(x => x.ids.length > 1);
  return a.slice().sort((x, y) => y.ids.length - x.ids.length || x.n.localeCompare(y.n));
}
function actListHTML() {
  const rows = actorRows(), shown = rows.slice(0, st.actLimit);
  if (!rows.length) return `<div class="empty"><h2>לא נמצא שחקן</h2><p>נסו חלק מהשם, באנגלית או בעברית. בעברית החיפוש מבוסס על הגייה, ולכן הכתיב לא חייב להיות מדויק. הרשימה כוללת רק את השחקנים המרכזיים בכל סדרה, ולכן ייתכן ששחקן מוכר חסר.</p></div>`;
  return shown.map(a => {

    return `<button class="arow" data-a="actor" data-k="${k}">${avatar(a.n)}<span class="ainfo"><b><bdi>${a.n}</bdi></b><small>${names}${more > 0 ? " ועוד " + more : ""}</small></span><span class="acount">${a.ids.length}</span></button>`;
  }).join("") + (rows.length > shown.length ? `<button class="btn ghost block" data-a="actmore">הצגת עוד (${rows.length - shown.length})</button>` : "");
}
function actorsHTML() {

  <div id="phPanel">${phPanelHTML()}</div>

/* actions */
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]"); if (!el) return;
  const a = el.dataset.a, v = el.dataset.v, i = el.dataset.i !== undefined ? +el.dataset.i : null;
  switch (a) {
    case "tab": st.tab = v; render(true); break;
    case "start": st.ans = blankAns(); st.touched = {}; st.screen = "q"; st.step = 0; render(true); break;
    case "surprise": st.tab = "pick"; rank(true); st.screen = "result"; render(true); break;
    case "back": if (st.step === 0) st.screen = "intro"; else st.step--; render(true); break;
    case "opt": {
      if (st.advancing) break; st.advancing = true;
      const q = el.dataset.q; st.touched = st.touched || {}; st.touched[q] = true;
      const val = v === "any" ? null : (isNaN(+v) ? v : +v);
      st.ans[q] = val; render(false);
      setTimeout(() => { st.advancing = false; st.step++; render(true); }, 180);
      break; }
    case "chip": { const g = st.ans[el.dataset.q], k = g.indexOf(v); if (k >= 0) g.splice(k, 1); else g.push(v); render(false); break; }
    case "lplat": st.listPlat = v === "all" ? null : v; render(false); break;
    case "next": st.step++; render(true); break;
    case "toggle": if (st.seen.has(i)) st.seen.delete(i); else st.seen.add(i); save(); render(false); break;
    case "finish": rank(false); st.screen = "result"; render(true); break;
    case "another": st.idx++; st.chosen = false; render(true); break;
    case "alt": st.idx = +el.dataset.k; st.chosen = false; render(true); break;
    case "choose": st.chosen = true; render(false); break;
    case "unchoose": st.chosen = false; st.idx++; render(true); break;
    case "markseen": st.seen.add(i); save(); st.ranked = st.ranked.filter(r => r.i !== i); render(true); break;
    case "edit": st.tab = "pick"; st.screen = "q"; st.step = 0; render(true); break;
    case "resetseen": st.seen.clear(); save(); rank(false); render(true); break;
    case "lsrc": st.listSrc = v; render(false); break;
    case "hideseen": st.hideSeen = !st.hideSeen; render(false); break;
    case "detail": openDlg(i); break;
    case "dseen": { const k = st.dlgId; if (st.seen.has(k)) st.seen.delete(k); else st.seen.add(k); save(); paintDlg(true); render(false); break; }
    case "dback": dlgBack(); break;
    case "actor": dlgGo({ t: "a", v: +el.dataset.k }); break;
    case "actpick": { const a = actorIndex()[+el.dataset.k], un = a.ids.filter(x => !st.seen.has(x)); if (un.length) dlgGo({ t: "s", v: un[Math.floor(Math.random() * un.length)] }); break; }
    case "phpaste": { (async () => { try { const items = await navigator.clipboard.read(); for (const it of items) { const ty = it.types.find(x => x.startsWith("image/")); if (ty) { const b = await it.getType(ty); await addFromFile(+el.dataset.k, new File([b], "pasted", { type: ty })); return; } } phMsg(NO_IMG); } catch (err) { phMsg("הדפדפן לא מאפשר קריאה מהלוח. לחצו על האזור המקווקו והדביקו בקיצור המקלדת להדבקה."); } })(); break; }
    case "copylink": copyText(el.dataset.u).then(ok => showToast(ok ? "הקישור הועתק. הדביקו אותו בדפדפן או באפליקציית יוטיוב." : "אי אפשר להעתיק מהמסך הזה. סמנו את הכתובת והעתיקו אותה ידנית.", el.dataset.u)); break;
    case "phdel": { const a = actorIndex()[+el.dataset.k], old = PH[a.n]; delete PH[a.n]; savePH().then(() => old && ASSETS.delete(old)).catch(() => {}); refreshActors(); break; }
    case "actall": st.actMulti = !st.actMulti; st.actLimit = 60; render(false); break;
    case "actmore": st.actLimit += 60; $("#actList").innerHTML = actListHTML(); break;
    case "dclose": $("#dlg").close(); break;
  }
});
$("#dlg").addEventListener("click", e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
$("#dlg").addEventListener("close", () => { st.dlgStack = []; st.dlgCur = null; });
document.addEventListener("input", e => { if (e.target && e.target.id === "actq") { st.actQuery = e.target.value; st.actLimit = 60; $("#actList").innerHTML = actListHTML(); } });

/* photos: managed by the people who can edit the page (assets + db capabilities) */
let PH = {}, DBH = null, ASSETS = null, CAN_UPLOAD = false, saveChain = Promise.resolve();
const normName = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/[^a-z0-9\u0590-\u05FF]/g, "");
function matchActor(fileName) {
  const f = normName(fileName.replace(/\.[^.]+$/, "")); let best = null, bl = 0;
  for (const a of actorIndex()) { const n = normName(a.n); if (n && f.includes(n) && n.length > bl) { best = a; bl = n.length; } }
  return best;
}
async function toAvatarBlob(file) {
  const bmp = await createImageBitmap(file), side = Math.min(bmp.width, bmp.height);
  const c = document.createElement("canvas"); c.width = c.height = 256;
  c.getContext("2d").drawImage(bmp, (bmp.width - side) / 2, (bmp.height - side) * 0.2, side, side, 0, 0, 256, 256);
  return await new Promise(r => c.toBlob(r, "image/jpeg", 0.85));
}
function savePH() { const p = saveChain.then(() => DBH.doc("photos/actors").set({ map: { ...PH } })); saveChain = p.catch(() => {}); return p; }
const sleep = ms => new Promise(r => setTimeout(r, ms));
async function setPhoto(name, file) {
  const blob = await toAvatarBlob(file);
  let res;
  try { res = await ASSETS.upload(blob, { type: "image/jpeg" }); }
  catch (e) { if (e && e.code === "rate_limited") { await sleep(3000); res = await ASSETS.upload(blob, { type: "image/jpeg" }); } else throw e; }
  const old = PH[name]; PH[name] = res.id;
  await savePH();
  if (old && old !== res.id) { try { await ASSETS.delete(old); } catch (e) {} }
  refreshActors();
}
function setStatus(msg) { st.phStatus = msg; const el = $("#phStatus"); if (el) el.textContent = msg; }
async function bulkPhotos(files) {
  const list = [...files], miss = [], fail = []; let ok = 0;
  for (let i = 0; i < list.length; i++) {
    const f = list[i], a = matchActor(f.name);
    setStatus(`מעלה ${i + 1} מתוך ${list.length}...`);
    if (!a) { miss.push(f.name); continue; }
    try { await setPhoto(a.n, f); ok++; } catch (e) { fail.push(f.name + (e && e.code ? " (" + e.code + ")" : "")); }
  }
  setStatus(`הועלו ${ok} תמונות.` + (miss.length ? ` לא זוהה שם שחקן ב-${miss.length} קבצים: ${miss.slice(0, 6).join(", ")}${miss.length > 6 ? "..." : ""}.` : "") + (fail.length ? ` נכשלו: ${fail.slice(0, 4).join(", ")}.` : ""));
}
function phPanelHTML() {
  if (!CAN_UPLOAD) return "";
  const have = actorIndex().filter(a => PH[a.n]).length;
  return `<div class="phpanel"><b>ניהול תמונות</b><p>יש תמונות ל-${have} מתוך ${ACT.length} שחקנים. אפשר להעלות כמה קבצים בבת אחת: שם הקובץ צריך להכיל את שם השחקן באנגלית, למשל Pedro Pascal.jpg. השתמשו רק בתמונות שמותר לכם להשתמש בהן, למשל תמונות ברישיון חופשי מוויקימדיה קומונס.</p><label class="btn ghost"><input id="phfiles" type="file" accept="image/*" multiple hidden>העלאת תמונות</label><div id="phStatus" role="status">${st.phStatus || ""}</div></div>`;
}
function refreshActors() {
  const l = $("#actList"); if (l) l.innerHTML = actListHTML();
  const pn = $("#phPanel"); if (pn) pn.innerHTML = phPanelHTML();
  if (st.dlgCur && st.dlgCur.t === "a" && $("#dlg").open) paintDlg(true);
}
document.addEventListener("change", async e => {
  const t = e.target;
  if (!t || !t.files || !t.files.length) return;
  if (t.id === "phfiles") { const fs = [...t.files]; t.value = ""; await bulkPhotos(fs); }
  else if (t.id === "phone") {
    const a = actorIndex()[+t.dataset.k], f = t.files[0]; t.value = "";
    try { await setPhoto(a.n, f); } catch (err) { /* the dialog keeps showing the initials */ }
  }
});
/* add a photo found with a search engine: copy the image, then paste it here */
function phMsg(m) { st.phMsg = m; const el = $("#phMsg"); if (el) el.textContent = m; }
function phAddHTML(a, k) {
  const q = encodeURIComponent(/[\u0590-\u05FF]/.test(a.n) ? a.n : a.n + " actor");
  return `<div class="phadd"><b>הוספת תמונה מחיפוש</b>
    <ol><li><a href="https://www.google.com/search?tbm=isch&amp;q=${q}" target="_blank" rel="noopener noreferrer">חיפוש תמונות בגוגל</a> (נפתח בלשונית חדשה)</li><li>קליק ימני על תמונה, ואז ״העתק תמונה״</li><li>חזרו לכאן והדביקו: <bdi>⌘V</bdi> או <bdi>Ctrl+V</bdi></li></ol>
    <div class="pastezone" id="pz" contenteditable="true" role="textbox" aria-label="אזור הדבקת תמונה" data-ph="לחצו כאן והדביקו תמונה"></div>
    <button class="btn ghost" data-a="phpaste" data-k="${k}">הדבקה מהלוח</button>
    <div id="phMsg" role="status">${st.phMsg || ""}</div>
    <small>השתמשו רק בתמונות שמותר לכם להשתמש בהן.</small></div>`;
}
async function addFromFile(k, file) {
  const a = actorIndex()[k]; phMsg("שומר תמונה...");
  try { await setPhoto(a.n, file); phMsg("התמונה נוספה."); }
  catch (err) { phMsg("לא הצלחתי לשמור את התמונה" + (err && err.code ? " (" + err.code + ")" : "") + ". נסו תמונה בפורמט JPG או PNG."); }
}
function imageFromDT(dt) {
  if (!dt) return null;
  for (const it of dt.items || []) if (it.kind === "file" && it.type.startsWith("image/")) return it.getAsFile();
  return [...(dt.files || [])].find(f => f.type.startsWith("image/")) || null;
}
const NO_IMG = "לא נמצאה תמונה. בתוצאות החיפוש לחצו קליק ימני ובחרו ״העתק תמונה״ (לא ״העתק כתובת תמונה״), או שמרו אותה במחשב והעלו אותה.";
document.addEventListener("paste", e => {
  const d = $("#dlg"); if (!CAN_UPLOAD || !d.open || !st.dlgCur || st.dlgCur.t !== "a") return;
  e.preventDefault(); const f = imageFromDT(e.clipboardData);
  if (!f) { phMsg(NO_IMG); return; }
  addFromFile(st.dlgCur.v, f);
});
document.addEventListener("dragover", e => { if (e.target.closest && e.target.closest("#pz")) e.preventDefault(); });
document.addEventListener("drop", e => {
  if (!(e.target.closest && e.target.closest("#pz")) || !st.dlgCur || st.dlgCur.t !== "a") return;
  e.preventDefault(); const f = imageFromDT(e.dataTransfer);
  if (!f) { phMsg(NO_IMG); return; }
  addFromFile(st.dlgCur.v, f);
});
document.addEventListener("keydown", e => { if (e.target && e.target.id === "pz" && !(e.metaKey || e.ctrlKey) && e.key.length === 1) e.preventDefault(); });
/* external links: some viewers (for example in-app webviews) block new windows, so fall back to copying the address */
function legacyCopy(txt) {
  const ta = document.createElement("textarea"); ta.value = txt; ta.setAttribute("readonly", ""); ta.style.cssText = "position:fixed;top:0;opacity:0";
  document.body.appendChild(ta); ta.select(); let ok = false;
  try { ok = document.execCommand("copy"); } catch (e) {}
  ta.remove(); return ok;
}
function copyText(txt) {
  try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(txt).then(() => true, () => legacyCopy(txt)); } catch (e) {}
  return Promise.resolve(legacyCopy(txt));
}
let toastTimer = null;
function showToast(msg, url) {
  const old = document.getElementById("toast"); if (old) old.remove();
  const d = $("#dlg"), host = d && d.open ? d : document.body, el = document.createElement("div");
  el.id = "toast"; el.className = "toast"; el.setAttribute("role", "status");
  el.innerHTML = `<p></p>${url ? '<input readonly aria-label="כתובת הקישור">' : ""}`;
  el.querySelector("p").textContent = msg;
  if (url) { const inp = el.querySelector("input"); inp.value = url; inp.addEventListener("focus", () => inp.select()); }
  host.appendChild(el);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.remove(), 12000);
}
async function linkFallback(url) {
  const ok = await copyText(url);
  showToast(ok ? "אי אפשר לפתוח קישורים מהמסך הזה, ולכן הקישור הועתק. הדביקו אותו בדפדפן או באפליקציית יוטיוב." : "אי אפשר לפתוח קישורים מהמסך הזה. העתיקו את הכתובת ופתחו אותה בדפדפן.", url);
}
document.addEventListener("click", e => {
  const a = e.target.closest && e.target.closest('a[target="_blank"]'); if (!a) return;
  e.preventDefault();
  let w = null; try { w = window.open(a.href, "_blank"); } catch (err) {}
  if (w) { try { w.opener = null; } catch (err) {} } else linkFallback(a.href);
});
document.addEventListener("error", e => { if (e.target && e.target.tagName === "IMG" && e.target.closest && e.target.closest(".av")) e.target.remove(); }, true);
(async () => {
  try {
    if (!window.claude || !window.claude.use) return;
    DBH = await window.claude.use("db"); ASSETS = await window.claude.use("assets");
    if (DBH) DBH.doc("photos/actors").onSnapshot(s => { const d = s.exists ? s.data() : null; PH = d && d.map ? { ...d.map } : {}; refreshActors(); }, () => {});
    CAN_UPLOAD = !!(DBH && ASSETS); refreshActors();
  } catch (e) {}
})();

render(false);
</script>
</body>
